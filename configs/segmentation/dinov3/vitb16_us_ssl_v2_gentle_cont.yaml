# DINOv3 ViT-B/16 US-SSL v1 (domain-adapted on non-external ultrasound video frames).
# Same architecture as vitb16_last2blocks_mlp_decoder.yaml; only the checkpoint differs.

paths:
  dataset_root: data/processed/sms/baseline_2d_unet_holdout_crop_ui
  experiment_root: experiments/segmentation
  dinov3_repo: external/dinov3/dinov3
  dinov3_asset_root: external/dinov3
  checkpoint_path: artifacts/model_weights/dinov3_vitb16_us_ssl_v2_gentle_cont_student.pth

experiment:
  task_name: segmentation
  model_alias: dinov3_vitb16_us_ssl_v2_gentle_cont
  data_version: dataset_v20260409_holdout_cropui
  run_id: r001

model:
  backbone_family: dinov3
  hub_model: dinov3_vitb16
  architecture: dinov3_vitb16_us_ssl_v2_gentle_cont
  patch_size: 16
  input_size: 512
  freeze_backbone: true
  trainable_blocks: 0
  decoder:
    type: segdino_mlp
    channels: 256
    dropout: 0.05
    use_multiscale_tokens: true
    layer_indices: [2, 5, 8, 11]
