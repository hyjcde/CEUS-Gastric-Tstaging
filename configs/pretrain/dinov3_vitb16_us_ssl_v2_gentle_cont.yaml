# CONTINUATION of us_ssl_v2_gentle (2026-09-15 晚, 用户指示: loss 无 spike 且下降, lr 不调, 续训到 30 ep).
# 同一 output_dir 自动 resume ckpt/17999; 调度按 30 ep 重算, peak lr 仍 1e-5.
# DINOv3 ViT-B/16 SSL domain-adaptation v2: GENTLE recipe.
# Differs from v1 (dinov3_vitb16_us_ssl.yaml): lower lr (1e-5 vs 1e-3), fewer
# epochs (10 vs 30), larger v2 frameset (173,491 frames). Goal: small drift,
# not rewrite. v1 drifted ~100% of weight magnitude and hurt downstream.
#
# Launch (2x RTX 4090D):
#   torchrun --nproc_per_node=2 scripts/pretrain_dinov3_us_ssl.py \
#       --config-file configs/pretrain/dinov3_vitb16_us_ssl_v2_gentle.yaml \
#       --output-dir pipeline/experiments/tree/pretrain_dinov3_vitb16_us_ssl_v2_gentle

train:
  dataset_path: USFrames:root=/data/research/gastric/GastricTstaging/data/pretrain/us_ssl_v2_200k/images:list=/data/research/gastric/GastricTstaging/data/pretrain/us_ssl_v2_200k/files.txt
  output_dir: pipeline/experiments/tree/pretrain_dinov3_vitb16_us_ssl_v2_gentle
  batch_size_per_gpu: 48
  num_workers: 8
  saveckp_freq: 2
  OFFICIAL_EPOCH_LENGTH: 1807   # 173,491 frames / global batch 96
  cache_dataset: false
  compile: false
  checkpointing: true
  seed: 0

student:
  arch: vit_base
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  pretrained_weights: /data/research/gastric/GastricTstaging/external/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  ffn_layer: mlp
  ffn_ratio: 4.0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: layernorm
  n_storage_tokens: 4
  mask_k_bias: true
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_rescale_coords: 2
  pos_embed_rope_dtype: fp32
  fp8_enabled: false

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 3
  in_chans: 3

gram:
  use_loss: false

dino:
  loss_weight: 1.0
  head_n_prototypes: 16384
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]
  separate_head: true
  head_n_prototypes: 16384
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

crops:
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 8
  local_crops_scale: [0.05, 0.32]
  global_crops_size: 224
  local_crops_size: 96
  horizontal_flips: true
  rgb_mean: [0.485, 0.456, 0.406]
  rgb_std: [0.229, 0.224, 0.225]

optim:
  epochs: 30                   # cont: 30 x 1807 = ~54k iters (resume from 10-ep ckpt; peak lr unchanged)
  optimizer: adamw
  lr: 1.0e-05                  # gentle: fixed low lr (no aggressive scaling)
  weight_decay: 0.04
  weight_decay_end: 0.1
  warmup_epochs: 1
  min_lr: 1.0e-07
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024   # ignored: schedules block present, lr taken from schedules.lr.peak
  layerwise_decay: 0.98

checkpointing:
  period: 2000
  max_to_keep: 3
  keep_every: 50000

schedules:
  lr:
    start: 0
    peak: 1.0e-05
    end: 1.0e-07
    warmup_epochs: 1
    freeze_last_layer_epochs: 1
  weight_decay:
    start: 0.04
    peak: 0.1
    end: 0.1
    warmup_epochs: 0
  teacher_temp:
    start: 0.04
    peak: 0.07
    end: 0.07
    warmup_epochs: 3
  momentum:
    start: 0.992
    peak: 1.0
    end: 1.0
    warmup_epochs: 0
