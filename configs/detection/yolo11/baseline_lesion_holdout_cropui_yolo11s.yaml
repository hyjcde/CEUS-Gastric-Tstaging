paths:
  internal_root: dataset/internal
  prospective_root: dataset/internal/prospective_2025/2025
  external_root: dataset/external
  split_output_dir: data/splits/detection/yolo11_lesion_holdout_cropui
  prepared_dataset_root: data/processed/detection/yolo11_lesion_holdout_cropui
  experiment_root: experiments/detection

experiment:
  task_name: detection
  model_alias: yolo11s_lesion_holdout_cropui
  data_version: dataset_v20260409_holdout_cropui
  run_id: r001
  baseline_name: detection_baseline_v1

data:
  view: crop_ui
  classes:
    - lesion
  label_to_class:
    lesion: lesion
  patient_id_regex: "^(.*?)[-_]\\d+$"

split:
  seed: 666
  val_fraction: 0.10
  internal_test_fraction: 0.10
  min_val_patients_per_year: 20
  min_internal_test_patients_per_year: 20

train:
  task: detect
  model: yolo11s.pt
  pretrained: true
  imgsz: 640
  epochs: 100
  batch: 16
  workers: 8
  device: "1"
  patience: 30
  optimizer: auto
  lr0: null
  lrf: null
  weight_decay: null
  warmup_epochs: null
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10
  cache: false
  amp: true
  cos_lr: false
  deterministic: true
  seed: 666

evaluation:
  imgsz: 640
  batch: 16
  device: "1"
  conf: 0.001
  iou: 0.6
  save_json: false
  plots: true

swanlab:
  enabled: true
  strict: false
  project: gastric_tstaging_detection
  workspace: null
  experiment_name: null
  description: "YOLOv11s lesion detection contrast run on crop_ui with fixed internal holdout, prospective test, and external test."
  group: detection_baseline_v1
  tags:
    - baseline
    - detection
    - yolo11s
    - crop_ui
  logdir: swanlab
  mode: cloud
  public: false
  resume: never
  parallel: null
  resume_eval_to_train_run: true
