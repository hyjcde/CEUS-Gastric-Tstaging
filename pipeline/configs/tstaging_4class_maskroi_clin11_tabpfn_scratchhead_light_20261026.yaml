experiment_name: tstaging_4class_maskroi_clin11_tabpfn_scratchhead_light_20261026
description: >-
  Same architecture and light-flip config as the 0.666 model. The classification
  head, fusion, clinical MLP and auxiliary heads are randomly initialized.
  Only the frozen ConvNeXt backbones are loaded. Local images are the 100 percent
  crop_roi expansion.
project_os: pipeline/experiments/mainlines/tstaging_4class/project_os.yaml
mainline_name: optimization_mainline
stage_name: maskroi_clin11_tabpfn_freeze
baseline_parent: tstaging_4class_acc_boost2_multitask_screened_eval_phase0
roi_type: doctor_roi
mask_type: predicted_lesion_mask_4ch
clinical_type: clinical_11d_plus_tabpfn25_oof4d
breakthrough_type: maskroi_clin11_tabpfn_freeze
contrastive_type: none
deploy_realism_level: mask_augmented_reference
asset_profile: screened_train_val_mask4ch_phase0_xiehe
target_metric: patient_accuracy

pretrained_checkpoint: "pipeline/experiments/tree/gastric_tstage_4class/classification/dual_convnext/tstaging_backbone_only_20261026.pth"

model_type: dual_branch
global_backbone: convnext_base.fb_in22k_ft_in1k_384
local_backbone: convnext_small.in12k_ft_in1k
global_in_channels: 4
num_classes: 4
class_names: [T1, T2, T3, T4+]
fusion_type: cross_attention
fusion_hidden: 512

clinical_cols:
  - age_norm
  - age_missing
  - sex_norm
  - sex_missing
  - lauren_type_norm
  - lauren_type_missing
  - differentiation_norm
  - differentiation_missing
  - tumor_length_cm_norm
  - tumor_length_cm_missing
  - tumor_thickness_cm_norm
  - tumor_thickness_cm_missing
  - tumor_location_norm
  - tumor_location_missing
  - cea_value_norm
  - cea_value_missing
  - cea_binary_norm
  - cea_binary_missing
  - ca199_value_norm
  - ca199_value_missing
  - ca199_binary_norm
  - ca199_binary_missing
  - tabpfn25_p0
  - tabpfn25_p1
  - tabpfn25_p2
  - tabpfn25_p3
clinical_n_fields: 12
clinical_dim: 26
clinical_hidden: 64

data_dir: "pipeline/data/tstaging_4class_maskroi_clin11_tabpfn_roi100_20261026"
eval_splits: [test_prospective]
use_mask_channel: true
mask_augment_align: true
mask_dir: /data/research/gastric/Tstaging/pipeline/data/tstaging_4class_forced_pipeline_20260322/predicted_mask
patient_agg: mean

global_size: 384
local_size: 224
image_size: 224
aug_level: light
patient_sampling: true
max_frames_per_patient: 6
class_balanced_sampling: true
class_boost:
  1: 1.75
  2: 1.65

batch_size: 8
lr: 0.000003
backbone_lr_mult: 0.0
head_lr_mult: 12
freeze_backbone_epochs: 40
weight_decay: 0.022
dropout: 0.34
label_smoothing: 0.03
epochs: 40
early_stopping: 20
early_stopping_metric: patient_accuracy
head_hidden: 512
warmup_epochs: 2
scheduler: cosine
loss: ordinal
lambda_ord: 0.26
class_weights: [0.65, 1.7, 1.55, 0.95]
multitask: true
use_aux_t3t4: true
lambda_binary: 0.28
lambda_t1t2: 0.42
lambda_t3t4: 0.5
boundary_aware_loss: true
lambda_boundary: 0.35
boundary_weights: [0.5, 1.45, 1.55]
asymmetric_cost_aux: true
lambda_asym_cost: 0.38
cost_matrix:
  - [0.0, 2.5, 1.3, 1.6]
  - [6.0, 0.0, 1.4, 5.0]
  - [2.2, 3.2, 0.0, 4.2]
  - [2.0, 2.2, 2.0, 0.0]
mixup: 0.0
ema: true
ema_decay: 0.998
grad_clip: 1.0
amp: true
gradient_accumulation: 4
num_workers: 8
seed: 20260820
no_leak_policy:
  selection_splits: [train, val, test_prospective]
  final_external_csv: pipeline/data/tstaging_4class_screened_latest_external_2966_20260529/test_external_clinical.csv
  external_label_use: report_only_after_training
  phase0_train_policy: internal_only_no_ext_rows
