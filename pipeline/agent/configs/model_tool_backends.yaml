# Network-model backends exposed as Agent tools.
#
# This registry is the contract layer between:
# - frontend case review in apps/gastric_scan_next
# - Python Agent orchestration in pipeline/agent
# - trained checkpoints under pipeline/experiments
#
# It is intentionally descriptive first. Tool adapters should read this registry
# before loading heavyweight checkpoints so model provenance and trust labels stay
# visible to the Agent report.

schema_version: "0.1.0"
updated_at: "2026-08-09"
freeze_decision_doc: docs/mainline/asset_freeze_decision_20260809.md

default_backend_policy:
  prefer_trusted: true
  allow_caution_for_research: true
  require_manual_review_for_avoid: true
  emit_backend_id_in_tool_trace: true

backends:
  - backend_id: gc_us_sign_scorer_v1
    tool_name: gc_us_signs
    model_task: structured_gc_us_sign_evidence
    adapter_target: pipeline.agent.tools.gc_us_sign_tool.GcUsSignTool
    algorithm: direction_normalized_geometry_and_clinical_rules
    model_family: deterministic_evidence_scorer
    network_backends:
      lesion_mask: segmentation_primary
      lumen_geometry: lumen_detection_primary
      wall_evidence: wall_evidence_lumen_sdf_v1
    trust_label: caution
    use_for:
      - core_sign_scorecard
      - auditable_geometry_visualization
      - physician_review_queue
    evidence_outputs:
      - sign_items
      - normalized_i
      - structural_gate
      - directional_geometry
    known_limits:
      - This is a structured evidence scorer, not an independently trained sign classifier.
      - Wall and growth outputs are geometry proxies and cannot establish pathological layer truth.

  - backend_id: lesion_segmentation_current_best
    tool_name: segmentation
    model_task: lesion_segmentation
    adapter_target: pipeline.agent.tools.segmentation_tool.SegmentationTool
    checkpoint_path: pipeline/experiments/tree/segmentation_auxiliary/segmentation/segmentation_misc/segmentation_fulldata/checkpoints/best_model.pth
    trust_label: caution
    use_for:
      - roi_generation
      - lesion_mask_evidence
      - morphology_input
    evidence_outputs:
      - mask_available
      - roi_bbox
      - lesion_area_ratio
      - roi_source
    known_limits:
      - Falls back when checkpoint is unavailable.
      - Needs source-specific quality review before driving high-risk conclusions.

  - backend_id: lesion_segmentation_dinov3_vitb16_last2blocks_candidate_20260512
    tool_name: segmentation_candidate
    model_task: lesion_segmentation
    adapter_target: pipeline.agent.tools.dinov3_segmentation_tool.DINOv3SegmentationTool
    checkpoint_path: experiments/segmentation/segmentation_dinov3_vitb16_last2blocks_holdout_cropui_dataset_v20260409_20260511_r001/checkpoints/best.pt
    config_path: configs/segmentation/dinov3/vitb16_last_blocks_adapter.yaml
    trust_label: caution
    use_for:
      - roi_generation_candidate
      - lesion_mask_evidence_candidate
      - t2_t3_error_review
      - external_prospective_segmentation_recovery
    validation_summary:
      internal_holdout_dice: 0.7499
      internal_holdout_iou: 0.6269
      internal_holdout_zero_dice_ratio: 0.0082
      external_eval_dice: 0.6820
      external_eval_iou: 0.5524
      external_eval_zero_dice_ratio: 0.0172
      prospective_eval_dice: 0.7144
      prospective_eval_iou: 0.5900
      prospective_eval_zero_dice_ratio: 0.0185
      baseline: lesion_segmentation_unetplusplus_resnet34_imagenet_cropui_20260415
      external_dice_delta_vs_baseline: 0.0383
      prospective_dice_delta_vs_baseline: -0.0056
    evidence_outputs:
      - mask_available
      - roi_bbox
      - lesion_area_ratio
      - boundary_f1
      - zero_dice_risk
      - backend_validation_summary
    known_limits:
      - Requires a DINOv3-specific inference adapter before live Agent use.
      - Internal holdout Dice remains slightly below the UNet++ baseline.
      - Prospective Dice is near parity but not above baseline; use as research candidate before promotion.
      - Patient-level T2/T3 impact still needs a dedicated downstream panel.

  - backend_id: sam31_gastric_lora_full_components_5epoch_run2
    tool_name: segmentation_interactive
    model_task: lesion_segmentation_interactive
    adapter_target: scripts.serve_sam31_static
    checkpoint_path: external/sam3.1/sam3.1_multiplex.pt
    lora_checkpoint_path: artifacts/sam31_training/sam31_gastric_lora_full_components_5epoch_run2/best_lora_weights.pt
    service_url: http://127.0.0.1:8768
    registry_ref: pipeline/agent/config/agent_backend_registry.yaml#sam31_gastric_lora_full_components_5epoch_run2
    trust_label: caution
    use_for:
      - interactive_static_mask
      - video_precompute_cache
      - workbench_contour_edit
      - agent_segmentation_candidate_after_acceptance
    validation_summary:
      protocol: frozen_registry_static_sam31_oracle_box_v1
      lora_modules: 383
      adapter_keys: 766
      external_patient_mean_dice: 0.8544
      internal_holdout_patient_mean_dice: 0.8636
      prospective_patient_mean_dice: 0.8816
      empty_prediction_rate: 0.0
      video_canary_accepted_frames: 94
      video_canary_reanchors: 2
    evidence_outputs:
      - mask_available
      - roi_bbox
      - contour_points
      - backend_id
      - lora_checkpoint
    known_limits:
      - Oracle-box static Dice is not text-only discovery.
      - Native SAM3.1 multiplex memory is disabled; video uses motion-memory box wrapper.
      - Do not claim T-stage gain from Dice alone; Agent batch promotion still pending.

  - backend_id: tstage_4class_acc_boost2_screened_20260603
    tool_name: classification
    model_task: t_staging_4class
    adapter_target: pipeline.agent.tools.classification_tool.ClassificationTool
    checkpoint_path: pipeline/experiments/tree/gastric_tstage_4class/classification/dual_convnext/tstaging_4class_acc_boost2_multitask_screened_eval_20260603_162955/best_model.pth
    registry_ref: pipeline/agent/config/agent_backend_registry.yaml#tstage_acc_boost2_screened_20260603
    trust_label: trusted
    validation_summary:
      test_external_frame_auc: 0.8572
      test_prospective_frame_auc: 0.8655
      test_external_patient_acc_all_485: 0.629
      test_external_patient_acc_held_out_399: 0.556
      test_prospective_patient_acc: 0.720
    use_for:
      - single_case_t_stage_prior
      - agent_final_classification_evidence
    known_limits:
      - Full-cohort external ACC inflated by 86 train-seen overlap patients; report held-out 399.
      - Multimodal (clinical22); not image-only.

  - backend_id: tstage_4class_acc_boost2_phase0_20260610
    tool_name: classification_phase0_audit
    model_task: t_staging_4class
    adapter_target: pipeline.agent.tools.classification_tool.ClassificationTool
    checkpoint_path: pipeline/experiments/tree/gastric_tstage_4class/classification/dual_convnext/tstaging_4class_acc_boost2_multitask_screened_eval_phase0_20260610_225852/best_model.pth
    registry_ref: pipeline/agent/config/agent_backend_registry.yaml#tstage_acc_boost2_phase0_20260610
    trust_label: caution
    validation_summary:
      test_external_patient_acc_doctor_roi: 0.464
      test_external_patient_acc_predicted_roi: 0.471
      overlap_clinical_patient_uids: 0
    use_for:
      - paper_strict_generalization_panel
      - no_external_train_audit
    known_limits:
      - Not the Agent final T backend.
      - Must be reported in a separate Phase 0 table; never mixed with legacy 485/399 ACC.

  - backend_id: tstage_4class_frozen_mask4ch_clinical22_20260423
    tool_name: classification
    model_task: t_staging_4class
    adapter_target: pipeline.agent.tools.classification_tool.ClassificationTool
    checkpoint_path: pipeline/experiments/tree/gastric_tstage_4class/classification/dual_mask4ch/tstaging_4class_dual_v2_mask4ch_clinical22_full_20260423_092301/best_model.pth
    registry_ref: pipeline/agent/config/agent_backend_registry.yaml#tstage_mask4ch_clinical22_frozen_20260423
    trust_label: trusted
    validation_summary:
      test_external_auc: 0.7326
      test_prospective_auc: 0.7455
    use_for:
      - single_case_t_stage_prior
      - agent_final_classification_evidence

  - backend_id: tstage_4class_antioverstage_v3_20260522
    tool_name: classification
    model_task: t_staging_4class
    adapter_target: pipeline.agent.tools.classification_tool.ClassificationTool
    checkpoint_path: pipeline/experiments/tree/gastric_tstage_4class/classification/dual_mask4ch/tstaging_4class_dual_v2_mask4ch_clinical22_t2t3_antioverstage_v3_head_finetune_20260522_200526/best_model.pth
    registry_ref: pipeline/agent/config/agent_backend_registry.yaml#tstage_mask4ch_antioverstage_v3_20260522
    trust_label: trusted
    validation_summary:
      test_external_auc: 0.6975
      test_prospective_auc: 0.7052
      t2t3_overstage_rate_external: 0.186
      t3_recall_external: 0.632
    use_for:
      - single_case_t_stage_prior
      - t2_t3_boundary_review
      - gradcam_t2t3_panels
    known_limits:
      - External macro-AUC below frozen 20260423; use 30/70 ensemble if AUC priority.

  - backend_id: tstage_4class_legacy_dual_branch_mask4ch
    tool_name: classification
    model_task: t_staging_4class
    adapter_target: pipeline.agent.tools.classification_tool.ClassificationTool
    checkpoint_path: pipeline/experiments/tstaging_4class_dual_v2_mask4ch_20260302_201944/best_model.pth
    trust_label: avoid
    use_for:
      - single_case_t_stage_prior
      - fallback_classifier_evidence
    evidence_outputs:
      - top1_stage
      - top1_prob
      - probabilities
      - entropy
    known_limits:
      - Older adapter reconstructs DualBranchClassifier rather than newer contrastive_dual runs.
      - Should not be treated as the only final diagnostic evidence.

  - backend_id: tstage_4class_boxguided_contrastive_external_prospective_candidate_20260506
    tool_name: classification_candidate
    model_task: t_staging_4class
    adapter_target: planned.pipeline.agent.tools.contrastive_tstaging_tool
    checkpoint_path: pipeline/experiments/tree/gastric_tstage_4class/contrastive/contrastive_dual_convnext/tstaging_4class_boxguided_wall_region_contrastive_clinical22_prospective_auc_retention_external_recovery_from_refinement_best_20260506_222312/best_model.pth
    config_path: pipeline/configs/tstaging_4class_boxguided_wall_region_contrastive_clinical22_prospective_auc_retention_external_recovery_from_refinement_best.yaml
    trust_label: caution
    use_for:
      - external_prospective_t_stage_evidence
      - t2_t3_error_review
      - candidate_model_backend_for_agent_upgrade
    validation_summary:
      test_external_auc: 0.7067
      test_external_accuracy: 0.4504
      test_external_newzip_auc: 0.5682
      test_external_newzip_accuracy: 0.3374
      test_prospective_auc: 0.7908
      test_prospective_accuracy: 0.4444
    evidence_outputs:
      - top1_stage
      - probabilities
      - classwise_auc_context
      - uncertainty_flags
      - backend_validation_summary
    known_limits:
      - Requires a new contrastive_dual inference adapter before use in live frontend analysis.
      - External-newzip AUC remains weak and should trigger tool-governance caution.
      - Current metrics are sample-level; patient-level report should be checked from run summary before promotion.

  - backend_id: deterministic_report_cue_extractor_20260507
    tool_name: structure_report
    model_task: report_text_structuring
    adapter_target: pipeline.agent.tools.report_tool.ReportTool
    checkpoint_path: null
    trust_label: caution
    use_for:
      - ultrasound_report_cue_extraction
      - report_image_conflict_review
      - multimodal_case_memory_input
    evidence_outputs:
      - sections_available
      - report_cues
      - text_length
      - uncertainty_flags
    known_limits:
      - Rule-based Chinese/English keyword extractor; it is not a clinical language model.
      - Report cues are supporting evidence only and must not directly determine final T stage.
      - Pathology text may contain post-operative truth and should be separated from pre-operative inference.

promotion_rules:
  trusted:
    minimum_external_auc: 0.70
    minimum_prospective_auc: 0.75
    requires_patient_level_review: true
    requires_t2_t3_error_panel: true
  caution:
    allowed_in_research_panel: true
    requires_uncertainty_flag: true
  avoid:
    block_final_report_weight: true
