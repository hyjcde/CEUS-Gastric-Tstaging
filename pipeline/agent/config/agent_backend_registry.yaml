# ─────────────────────────────────────────────────────────────────────
# Two-stage triage policy (2026-06-10)
# ─────────────────────────────────────────────────────────────────────
# Selects the agent's behaviour when the binary gate returns:
#   - skip_t: high-confidence benign — agent bypasses T-staging chain.
#   - run_t:  any non-benign prediction — full L1 chain runs.
#
# Three modes:
#   - conditional: skip_t only when P(benign) >= skip_t_threshold AND
#     top1 == benign. Conservative — every other case runs T-staging.
#     This is the **default** for production.
#   - soft:        binary is one more evidence; never skip T. Useful
#     when readers want to compare with/without the binary cue.
#   - off:         no binary tool at all. Reproduces the pre-binary
#     mainline behaviour exactly.
#
# Override at runtime:
#   scripts/run_e2e_react_demo.py --triage-mode soft
#   scripts/run_e2e_react_demo.py --triage-mode off
#   scripts/run_e2e_react_demo.py --triage-mode conditional --skip-t-threshold 0.90
triage_policy:
  default_mode: conditional
  skip_t_threshold: 0.95
  rationale: >
    skip_t is *strict by design* — P(benign) must be ≥ 0.95 to short-circuit
    T-staging. This compensates for the binary model's external Sens of
    only 54.8% (held-out screened external 1358 patient). The 219/1358
    false-negative patients (gt=malignant but pred=benign) live in
    docs/benign_malignant/must_review_FN.csv and are flagged for
    mandatory human review regardless of triage mode.
  must_review_list:
    path: docs/benign_malignant/must_review_FN.csv
    source: >
      Generated by scripts/build_binary_fn_must_review_list.py from
      pipeline/experiments/tree/gastric_binary/.../121138/eval/
      test_screened_external_latest_2966/test_predictions.csv at
      threshold 0.83 (calibrated Sens 0.730, Spec 0.619).
    threshold_used: 0.83
    count: 131
    coverage: 131 of 485 external malignant patients (~27%)

memory:
  schema_version: "0.1.0"
  default_store_root: pipeline/agent/memory/store_data/default
  fusion_mode: soft_prior  # off | soft_prior — biases RAG/review only; never overrides ClassificationTool logits
  promote_min_support: 3
  quality_score:
    correct_delta: 0.05
    wrong_delta: -0.08
    clamp: [0.0, 1.0]
  retrieval:
    top_k_episodes: 5
    top_k_procedural: 8
    scenario_tags: [t2_t3_boundary, t_staging_multimodal_review]
  registry_notes:
    - "LLM does not decide final T; memory affects evidence weights and review priority only"
    - "Evolver CLI: python -m agent.memory.evolver --action reflect-batch|promote"
    - "Eval: pipeline/agent/evaluation/run_self_evolution_eval.py"
