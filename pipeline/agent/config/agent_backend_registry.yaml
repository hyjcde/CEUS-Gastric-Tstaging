# Agent production backend registry (Phase A lock).
#
# Sources of truth:
#   - pipeline/experiments/tables/tstaging_4class_mainline_scoreboard.csv
#   - pipeline/experiments/mainlines/tstaging_4class/baseline_registry.yaml
#   - pipeline/agent/configs/model_tool_backends.yaml (research / caution backends)
#
# Selection policy (2026-05):
#   - Agent **final T** uses governance-frozen primary (best prospective among promoted).
#   - **External-generalization** signal uses region-aware as secondary evidence (not sole final).
#   - Legacy 20260302 mask4ch run is deprecated (checkpoint often missing on disk).

schema_version: "1.0.0"
updated_at: "2026-06-10"

selection_policy:
  primary_metric_for_agent_final: test_prospective_auc
  secondary_metric_for_external_panel: test_external_auc
  external_reporting: held_out_disjoint_399_patients
